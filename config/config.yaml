# Multimodal OS Controller — configuration
#
# Mappings are platform-independent: an input produces an action name, and the
# OS adapter decides how to execute it. Keep OS specifics out of this file.

# Reject any decision below this confidence unless the action overrides it.
# Strict: the fine-tuned model abstains on unrelated speech (that's the main
# filter), so this only gates borderline valid commands.
min_confidence: 0.50
confirmation_timeout_seconds: 30

# Recognition tuning. These are conservative defaults; adjust only after
# observing the live camera and event stream.
gesture_settings:
  camera_index: 0
  static_min_confidence: 0.80
  static_stable_frames: 8
  static_cooldown_seconds: 0.80
  swipe_min_travel: 0.22
  swipe_cooldown_seconds: 0.70

# Optional stricter thresholds for individual gesture names.
gesture_confidence:
  four_fingers: 0.75

# Gesture name -> action. The gesture recognizer stays generic; only this map
# ties a gesture to meaning.
gestures:
  swipe_left:
    action: previous_workspace
  swipe_right:
    action: next_workspace
  swipe_up:
    action: volume_up
  swipe_down:
    action: volume_down
  four_fingers:
    action: lock_screen
  fist:
    action: mute
  thumbs_up:
    action: volume_up
  thumbs_down:
    action: volume_down

# Keyboard key -> action (normalized key names, not raw scancodes).
keyboard:
  MEDIA_PLAY_PAUSE:
    action: play_pause
  MEDIA_NEXT:
    action: next_track
  MEDIA_PREV:
    action: previous_track

# Optional per-platform hints for adapters. The core never reads these; the
# adapter for the active platform may.
platforms:
  linux:
    workspace_manager: hyprland
  macos:
    workspace_manager: native_spaces
