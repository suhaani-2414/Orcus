[project]
name = "multimodal-os-controller"
version = "0.1.0"
description = "Local-first multimodal OS control: normalize voice/gesture/keyboard into validated intents, execute via platform adapters."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
voice = [
    "elevenlabs>=1.0",
]
gemini = [
    "google-genai>=1.0",
]
tui = [
    "textual>=0.60",
]
gesture = [
    "mediapipe>=0.10",
    "numpy>=1.24",
    "scikit-learn>=1.8,<1.9",
]

[project.scripts]
osctl = "controller.main:main"
orcus = "controller.cli:orcus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controller"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
